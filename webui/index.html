<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Archery Shot Clock</title>
    <style>
      :root {
        --bg: #0f172a;
        --panel: #111827;
        --accent: #22c55e;
        --text: #e5e7eb;
        --danger: #ef4444;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: Arial, sans-serif;
      }
      .wrap {
        max-width: 960px;
        margin: 40px auto;
        padding: 24px;
      }
      .panel {
        background: var(--panel);
        border-radius: 12px;
        padding: 24px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      }
      .timer {
        font-size: clamp(3rem, 9vw, 7rem);
        font-weight: 700;
        letter-spacing: 0.08em;
        margin: 16px 0;
      }
      .status {
        display: inline-block;
        padding: 8px 12px;
        border-radius: 999px;
        background: rgba(34, 197, 94, 0.2);
        color: #bbf7d0;
      }
      .controls {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        margin-top: 20px;
      }
      button {
        border: none;
        border-radius: 8px;
        padding: 10px 16px;
        font-weight: 600;
        background: #2563eb;
        color: white;
      }
      button.danger {
        background: var(--danger);
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="panel">
        <div id="status" class="status">READY</div>
        <div id="timer" class="timer">30.0s</div>
        <div id="light">Light state: OFF</div>
        <div id="phase">Phase: IDLE</div>
        <div id="active-list">Awaiting start</div>
        <div class="controls">
          <button data-action="start">Start</button>
          <button data-action="stop">Stop</button>
          <button data-action="pause">Pause</button>
          <button data-action="resume">Resume</button>
          <button class="danger" data-action="emergency">Emergency Stop</button>
        </div>
      </div>
    </div>
    <script src="/app.js"></script>
  </body>
</html>
